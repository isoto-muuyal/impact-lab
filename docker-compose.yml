services:
  impactlab:
    image: ${IMAGE_URI:-impactlab:local}
    container_name: ${CONTAINER_NAME:-impactlab}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-5000}:5000"
    networks:
      - impactlab-network

  tempo:
    image: grafana/tempo:latest
    container_name: ${TEMPO_CONTAINER_NAME:-tempo}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_OTLP_PORT:-4318}:4318"
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - impactlab-network

networks:
  impactlab-network:
    external: true
    name: ${DOCKER_NETWORK:-shared_network}
